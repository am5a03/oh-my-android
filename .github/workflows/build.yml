name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - scheme: OhMyAndroid
            bundle: Oh My Android.app
            product: android
          - scheme: MobileCapture
            bundle: Mobile Capture.app
            product: capture
    steps:
      - uses: actions/checkout@v4
      - name: Test companion handoff and discovery
        if: matrix.product == 'android'
        run: |
          bash Scripts/test-capture-handoff.sh
          bash Scripts/test-capture-companion-launcher.sh
      - name: Test selected-app quick actions
        run: bash Scripts/test-quick-actions.sh
      - name: Test iOS Simulator quick actions
        run: bash Scripts/test-simulator.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (warnings are errors)
        run: |
          xcodebuild -project OhMyAndroid.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- build
      - name: Check independent product boundaries
        run: |
          python3 -B Scripts/check-capture-product.py --product "${{ matrix.product }}" \
            --app "build/DerivedData/Build/Products/Release/${{ matrix.bundle }}" --allow-unbundled-dependencies
      - name: Test MCP server protocol
        if: matrix.product == 'android'
        run: Scripts/test-mcp.py "build/DerivedData/Build/Products/Release/Oh My Android.app/Contents/MacOS/ohmyandroid-mcp"
